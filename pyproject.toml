[project]
name = "ied-detector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "lightgbm",
    "mne",
    "mne-bids",
    "torch",
    "lightning",
    "matplotlib",
    "jupyter",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ied_detector"]
